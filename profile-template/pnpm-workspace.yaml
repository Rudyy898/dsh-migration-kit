# dsh-profile-web pnpm workspace — 与原机一致（保证插件构建行为相同）
packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
# 版本锁定：即使 GUI「更新插件」把 package.json 的版本范围改大，
# pnpm install 也强制用这里锁定的版本（web-ui-all 0.1.20 不带 better-sidebar 聚合，
# 避免与独立 better-sidebar 重复挂载 /sidebar/api）
# 不锁版本：侧栏由 web-ui-all 全家桶统一提供（0.2.0+ 内置 better-sidebar），
# 不再独立安装 better-sidebar，避免双挂载 /sidebar/api
# 原生模块构建白名单（pnpm 11 的 onlyBuiltDependencies 优先于 allowBuilds；
# 预置这些保证全新机器首次安装不被 ERR_PNPM_IGNORED_BUILDS 拦截）
onlyBuiltDependencies:
  - cloudflared
  - cpu-features
  - ssh2
  - node-pty
  - '@deepseek-ai/dsh-subprocess-local'
  - '@google/genai'
  - koffi
  - protobufjs
# 兼容旧版 pnpm 的 allowBuilds（10.x）
allowBuilds:
  cloudflared: true
  cpu-features: true
  ssh2: true
  node-pty: true
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  koffi: true
  protobufjs: true
